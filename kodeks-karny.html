<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kodeks karny</title><style>body{margin:0;background:#070b12;color:#f4f7fb;font-family:Arial}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.search{padding:12px;background:#0d141f;border:1px solid #26354a;border-radius:8px;color:white}.layout{display:grid;grid-template-columns:290px 1fr;gap:18px;margin-top:22px}.card{background:#0d141f;border:1px solid #1b293b;border-radius:14px;overflow:hidden}.card h2{padding:17px;margin:0;border-bottom:1px solid #1b293b}.list{max-height:700px;overflow:auto}.item{padding:14px 17px;border-bottom:1px solid #1b293b;cursor:pointer}.item:hover,.item.active{background:#10223c}.item strong{display:block}.item span{display:block;color:#7e8da3;font-size:11px;margin-top:5px}.article{padding:25px}.article h3{color:#60a5fa;font-size:14px}.article p{white-space:pre-wrap;color:#c5cedb;line-height:1.75}.source{color:#7e8da3;font-size:12px}.source a{color:#60a5fa}@media(max-width:760px){.layout{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><header class="top"><div><h1>Kodeks karny</h1><p>Oficjalny tekst aktu otwórz w ELI.</p></div><input class="search" id="search" placeholder="Szukaj artykułu..."></header><section class="layout"><aside class="card"><h2>Artykuły</h2><div class="list" id="list"></div></aside><article class="card article"><h3 id="number">Wybierz artykuł</h3><h2 id="title">Kodeks karny</h2><p id="content">Wybierz artykuł z listy.</p><div class="source">Źródło: <a href="https://eli.gov.pl/eli/DU/2025/383/ogl" target="_blank" rel="noopener">ELI — Kodeks karny</a></div></article></section></main><script>const articles=['1','2','3','4','5'].map((id,i)=>({id,title:['Zasady odpowiedzialności karnej','Przestępstwo skutkowe przez zaniechanie','Humanitaryzm kar','Ustawa względniejsza dla sprawcy','Zakres terytorialny ustawy karnej'][i],text:'Pełną aktualną treść artykułu otwórz w oficjalnym źródle ELI.'}));const list=document.getElementById('list'),search=document.getElementById('search');function render(q=''){list.innerHTML='';articles.filter(a=>(a.id+' '+a.title).toLowerCase().includes(q.toLowerCase())).forEach((a,i)=>{const e=document.createElement('div');e.className='item'+(i?'':' active');e.innerHTML='<strong>Art. '+a.id+' — '+a.title+'</strong><span>Kodeks karny</span>';e.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));e.classList.add('active');document.getElementById('number').textContent='Art. '+a.id;document.getElementById('title').textContent=a.title;document.getElementById('content').textContent=a.text};list.appendChild(e)})}search.oninput=()=>render(search.value);render();</script></body></html>
