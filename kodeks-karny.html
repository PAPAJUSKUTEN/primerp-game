<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ustawy — Venus RP MTD</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f4f7fb;font-family:Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:26px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.header h1{margin:0;font-size:28px}.header p{color:#9ca8b8}.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px}input,select{width:100%;height:42px;padding:0 12px;border:1px solid #26354a;border-radius:8px;background:#0d141f;color:#fff}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{border:1px solid #1b293b;border-radius:14px;background:#0d141f;overflow:hidden}.card-title{padding:16px;border-bottom:1px solid #1b293b;font-weight:bold}.list{max-height:700px;overflow:auto}.act{padding:14px 16px;border-bottom:1px solid #1b293b;cursor:pointer}.act:hover,.act.active{background:#10223c}.act strong{display:block;font-size:13px}.act small{display:block;margin-top:6px;color:#7e8da3}.details{min-height:600px;padding:24px}.details h2{margin-top:0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tag{padding:5px 8px;border-radius:6px;background:#142a48;color:#93c5fd;font-size:11px}.text{white-space:pre-wrap;color:#c5cedb;line-height:1.7;font-size:14px;max-height:650px;overflow:auto}.muted{color:#7e8da3}.error{color:#fca5a5}.loading{color:#fcd34d}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:550px){.controls{grid-template-columns:1fr}.wrap{padding:16px}}
</style>
</head>
<body><main class="wrap"><header class="header"><div><h1>Polskie ustawy</h1><p>Aktualne dane pobierane z oficjalnego API ELI Sejmu RP.</p></div></header><section class="controls"><input id="query" placeholder="Szukaj po tytule..."><select id="journal"><option value="DU">Dziennik Ustaw</option><option value="MP">Monitor Polski</option></select><input id="year" type="number" min="1918" max="2100" value="2026" placeholder="Rok"><button id="load">Pobierz akty</button></section><section class="layout"><aside class="card"><div class="card-title">Lista aktów</div><div id="list" class="list"></div></aside><article class="card details"><h2 id="title">Wybierz akt prawny</h2><div id="meta" class="meta"></div><p id="status" class="muted">Wybierz rok i kliknij „Pobierz akty”.</p><pre id="text" class="text"></pre></article></section></main><script>
const API='https://api.sejm.gov.pl/eli';const list=document.getElementById('list'),query=document.getElementById('query'),year=document.getElementById('year'),journal=document.getElementById('journal'),status=document.getElementById('status'),title=document.getElementById('title'),meta=document.getElementById('meta'),text=document.getElementById('text');let acts=[];
async function loadActs(){list.innerHTML='';status.className='loading';status.textContent='Pobieranie listy aktów...';text.textContent='';try{const r=await fetch(`${API}/acts/${journal.value}/${year.value}`);if(!r.ok)throw Error();const data=await r.json();acts=Array.isArray(data)?data:(data.items||data.acts||[]);render();status.className='muted';status.textContent=`Pobrano ${acts.length} aktów. Wybierz pozycję.`}catch(e){status.className='error';status.textContent='Nie udało się pobrać danych. Uruchom stronę przez serwer lokalny i sprawdź dostęp do API.'}}
function render(){const q=query.value.toLowerCase().trim();list.innerHTML='';acts.filter(a=>JSON.stringify(a).toLowerCase().includes(q)).forEach(a=>{const el=document.createElement('div');el.className='act';const name=a.title||a.name||a.type||'Akt prawny';const pos=a.pos||a.position||a.id||'';el.innerHTML=`<strong>${escapeHtml(name)}</strong><small>Pozycja: ${escapeHtml(String(pos))}</small>`;el.onclick=()=>openAct(a,el);list.appendChild(el)})}
async function openAct(a,el){document.querySelectorAll('.act').forEach(x=>x.classList.remove('active'));el.classList.add('active');title.textContent=a.title||a.name||'Akt prawny';meta.innerHTML='';Object.entries(a).slice(0,8).forEach(([k,v])=>{const t=document.createElement('span');t.className='tag';t.textContent=`${k}: ${typeof v==='object'?JSON.stringify(v):v}`;meta.appendChild(t)});status.className='loading';status.textContent='Pobieranie pełnego tekstu aktu...';text.textContent='';const id=a.id||a.actId||a.pos;try{const r=await fetch(`${API}/acts/${journal.value}/${year.value}/${id}/text.html`);if(!r.ok)throw Error();text.textContent=await r.text();status.className='muted';status.textContent='Pełny tekst pobrany z ELI.'}catch(e){status.className='error';status.textContent='Nie udało się pobrać tekstu dla tego aktu. Otwórz akt w ELI lub sprawdź identyfikator API.'}}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}document.getElementById('load').onclick=loadActs;query.oninput=render;
</script></body></html>
