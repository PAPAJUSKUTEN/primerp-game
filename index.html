<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police MDT - Autoryzacja</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Canvas na tło (cząsteczki i siatka) */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Pływające kolorowe kule tła */
        .ambient-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .glow-ball {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            animation: floatBall 15s infinite alternate ease-in-out;
        }

        .ball-1 {
            width: 350px;
            height: 350px;
            background: #4f46e5;
            top: 10%;
            left: 15%;
        }

        .ball-2 {
            width: 400px;
            height: 400px;
            background: #06b6d4;
            bottom: 10%;
            right: 15%;
            animation-delay: -5s;
        }

        .ball-3 {
            width: 300px;
            height: 300px;
            background: #9333ea;
            top: 50%;
            left: 60%;
            animation-delay: -10s;
        }

        @keyframes floatBall {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -50px) scale(1.1); }
            100% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* Główny kontener logowania */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(18, 18, 26, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #06b6d4, #4f46e5, transparent);
        }

        /* Ikona i nagłówek */
        .terminal-badge {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(79, 70, 229, 0.15));
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            color: #06b6d4;
            font-size: 28px;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        .login-card h2 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .login-card p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Formularz */
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-field-wrapper {
            position: relative;
        }

        .input-field-wrapper i.icon-left {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .input-field-wrapper input {
            width: 100%;
            background: rgba(10, 10, 15, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 16px 14px 45px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field-wrapper input:focus {
            border-color: #06b6d4;
            background: rgba(15, 15, 25, 0.8);
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.15);
        }

        .input-field-wrapper input:focus ~ i.icon-left {
            color: #06b6d4;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 15px;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #ffffff;
        }

        /* Przycisk logowania */
        .btn-login {
            position: relative;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #06b6d4, #4f46e5);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 20px -5px rgba(6, 182, 212, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(6, 182, 212, 0.6);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: translateX(-100%);
            transition: transform 0.7s ease;
        }

        .btn-login:hover::after {
            transform: translateX(100%);
        }

        /* Powiadomienie Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(22, 22, 34, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 12px 24px;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            color: #06b6d4;
        }
    </style>
</head>
<body>

    <!-- Interaktywne tło z płótnem -->
    <canvas id="bg-canvas"></canvas>

    <!-- Pływające kolory w tle -->
    <div class="ambient-glow">
        <div class="glow-ball ball-1"></div>
        <div class="glow-ball ball-2"></div>
        <div class="glow-ball ball-3"></div>
    </div>

    <!-- Okno logowania -->
    <div class="login-wrapper" id="loginContainer">
        <div class="login-card">
            <div class="terminal-badge">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>Police MDT</h2>
            <p>Terminal Dyspozytorski CAD</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">Login / Numer Odznaki</label>
                    <div class="input-field-wrapper">
                        <i class="fa-solid fa-id-badge icon-left"></i>
                        <input type="text" id="username" placeholder="Wprowadź identyfikator..." required autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Hasło Systemowe</label>
                    <div class="input-field-wrapper">
                        <i class="fa-solid fa-lock icon-left"></i>
                        <input type="password" id="password" placeholder="••••••••••••" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fa-solid fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">
                    Autoryzuj Dostęp
                </button>
            </form>
        </div>
    </div>

    <!-- Powiadomienie systemowe -->
    <div class="toast" id="toastMessage">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastText">Pomyślnie uwierzytelniono w systemie.</span>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        let mouse = { x: null, y: null, radius: 120 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.size = Math.random() * 2 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let angle = Math.atan2(dy, dx);
                        this.x -= Math.cos(angle) * 1.5;
                        this.y -= Math.sin(angle) * 1.5;
                    }
                }
            }

            draw() {
                ctx.fillStyle = 'rgba(6, 182, 212, 0.6)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 14000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();

                for (let j = i + 1; j < particlesArray.length; j++) {
                    let dx = particlesArray[i].x - particlesArray[j].x;
                    let dy = particlesArray[i].y - particlesArray[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 110) {
                        ctx.strokeStyle = `rgba(6, 182, 212, ${0.12 * (1 - distance / 110)})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const btn = document.getElementById('submitBtn');
            const toast = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Weryfikacja CAD...';
            btn.style.opacity = '0.8';

            setTimeout(() => {
                if (usernameInput === 'kadet1' && passwordInput === 'kadet1') {
                    toastText.innerText = 'Zalogowano pomyślnie! Ładowanie MDT...';
                    toast.classList.add('show');

                    setTimeout(() => {
                        loadMdtPanel(usernameInput);
                    }, 1000);

                } else {
                    btn.innerHTML = 'Autoryzuj Dostęp';
                    btn.style.opacity = '1';
                    
                    toastText.innerText = 'Błąd: Nieprawidłowy login lub hasło!';
                    toast.classList.add('show');
                    setTimeout(() => {
                        toast.classList.remove('show');
                    }, 3000);
                }
            }, 1000);
        }

        // Panel MDT z bocznym menu i pustymi sekcjami
        function loadMdtPanel(badgeId) {
            document.body.innerHTML = `
                <div style="width: 100vw; height: 100vh; background: #07080c; color: #fff; display: flex; font-family: 'Inter', sans-serif; overflow: hidden; z-index: 20; position: relative;">
                    
                    <!-- Boczne menu nawigacyjne -->
                    <aside style="width: 260px; background: rgba(14, 14, 20, 0.95); border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column;">
                        <div style="height: 70px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.06);">
                            <i class="fa-solid fa-shield-halved" style="color: #06b6d4; font-size: 22px;"></i>
                            <span style="font-weight: 700; letter-spacing: 0.5px; font-size: 15px;">POLICE MDT</span>
                        </div>
                        
                        <nav style="flex: 1; padding: 20px 15px; display: flex; flex-direction: column; gap: 8px;">
                            <button onclick="switchTab('baza', this)" class="nav-btn active" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.3); color: #06b6d4; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: left; transition: all 0.2s;">
                                <i class="fa-solid fa-database" style="width: 20px;"></i> Baza Danych
                            </button>
                            <button onclick="switchTab('pojazdy', this)" class="nav-btn" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: transparent; border: 1px solid transparent; color: #94a3b8; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500; text-align: left; transition: all 0.2s;">
                                <i class="fa-solid fa-car" style="width: 20px;"></i> Pojazdy
                            </button>
                            <button onclick="switchTab('obywatele', this)" class="nav-btn" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: transparent; border: 1px solid transparent; color: #94a3b8; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500; text-align: left; transition: all 0.2s;">
                                <i class="fa-solid fa-users" style="width: 20px;"></i> Obywatele
                            </button>
                            <button onclick="switchTab('zgloszenia', this)" class="nav-btn" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: transparent; border: 1px solid transparent; color: #94a3b8; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500; text-align: left; transition: all 0.2s;">
                                <i class="fa-solid fa-triangle-exclamation" style="width: 20px;"></i> Zgłoszenia
                            </button>
                            <button onclick="switchTab('raporty', this)" class="nav-btn" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: transparent; border: 1px solid transparent; color: #94a3b8; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500; text-align: left; transition: all 0.2s;">
                                <i class="fa-solid fa-file-lines" style="width: 20px;"></i> Raporty
                            </button>
                        </nav>

                        <div style="padding: 20px; border-top: 1px solid rgba(255,255,255,0.06);">
                            <div style="font-size: 12px; color: #64748b; margin-bottom: 8px;">Zalogowany jako:</div>
                            <div style="font-weight: 600; font-size: 13px; color: #fff; margin-bottom: 12px;"><i class="fa-solid fa-id-badge" style="color: #06b6d4; margin-right: 6px;"></i> ${badgeId}</div>
                            <button onclick="location.reload()" style="width: 100%; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: background 0.2s;">Wyloguj</button>
                        </div>
                    </aside>

                    <!-- Główny obszar zawartości -->
                    <main style="flex: 1; display: flex; flex-direction: column; background: #050508;">
                        <header style="height: 70px; background: rgba(14, 14, 20, 0.6); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0 35px;">
                            <h2 id="tabTitle" style="font-size: 18px; font-weight: 600; color: #fff; letter-spacing: -0.3px;">Baza Danych</h2>
                            <div style="font-size: 13px; color: #10b981; display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); padding: 6px 14px; border-radius: 20px;">
                                <i class="fa-solid fa-circle" style="font-size: 7px;"></i> System operacyjny CAD: Online
                            </div>
                        </header>

                        <!-- Puste kontenery poszczególnych zakładek -->
                        <div style="flex: 1; padding: 30px; overflow-y: auto;">
                            
                            <!-- Zakładka 1: Baza Danych -->
                            <div id="content-baza" class="tab-content" style="width: 100%; height: 100%;">
                                <!-- Tutaj wstawiasz własne elementy dla Bazy Danych -->
                            </div>

                            <!-- Zakładka 2: Pojazdy -->
                            <div id="content-pojazdy" class="tab-content" style="width: 100%; height: 100%; display: none;">
                                <!-- Tutaj wstawiasz własne elementy dla Pojazdów -->
                            </div>

                            <!-- Zakładka 3: Obywatele -->
                            <div id="content-obywatele" class="tab-content" style="width: 100%; height: 100%; display: none;">
                                <!-- Tutaj wstawiasz własne elementy dla Obywateli -->
                            </div>

                            <!-- Zakładka 4: Zgłoszenia -->
                            <div id="content-zgloszenia" class="tab-content" style="width: 100%; height: 100%; display: none;">
                                <!-- Tutaj wstawiasz własne elementy dla Zgłoszeń -->
                            </div>

                            <!-- Zakładka 5: Raporty -->
                            <div id="content-raporty" class="tab-content" style="width: 100%; height: 100%; display: none;">
                                <!-- Tutaj wstawiasz własne elementy dla Raportów -->
                            </div>

                        </div>
                    </main>
                </div>
            `;
        }

        // Skrypt przełączania pustych zakładek
        function switchTab(tabName, btnElement) {
            // Ukryj wszystkie treści
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            // Pokaż wybraną
            document.getElementById('content-' + tabName).style.display = 'block';

            // Zmień styl przycisków w menu
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.style.background = 'transparent';
                btn.style.borderColor = 'transparent';
                btn.style.color = '#94a3b8';
                btn.style.fontWeight = '500';
            });
            
            btnElement.style.background = 'rgba(6, 182, 212, 0.15)';
            btnElement.style.borderColor = 'rgba(6, 182, 212, 0.3)';
            btnElement.style.color = '#06b6d4';
            btnElement.style.fontWeight = '600';

            // Zmień nagłówek u góry
            const titles = {
                'baza': 'Baza Danych',
                'pojazdy': 'Rejestr Pojazdów',
                'obywatele': 'Ewidencja Obywateli',
                'zgloszenia': 'Aktywne Zgłoszenia Dispatch',
                'raporty': 'Raporty Służbowe'
            };
            document.getElementById('tabTitle').innerText = titles[tabName];
        }
    </script>
</body>
</html>
