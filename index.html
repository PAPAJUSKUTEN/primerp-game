<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel logowania</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      overflow: hidden;
      position: relative;

      background:
        linear-gradient(
          rgba(5, 8, 22, 0.72),
          rgba(19, 8, 48, 0.82)
        ),
        url("https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/5c3973bf-a629-5d92-8347-53ea66f8f95d/e0768043-f16d-5667-a3cd-c51a212d68ac.jpg");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      top: -120px;
      left: -100px;
      background: #7c3aed;
    }

    body::after {
      right: -120px;
      bottom: -120px;
      background: #06b6d4;
    }

    .login-box {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(10, 12, 35, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        0 0 35px rgba(124, 58, 237, 0.25);
      backdrop-filter: blur(17px);
      animation: showPanel 0.7s ease;
    }

    @keyframes showPanel {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: linear-gradient(135deg, #8b5cf6, #2563eb);
      font-size: 31px;
      box-shadow:
        0 10px 25px rgba(99, 102, 241, 0.45),
        0 0 25px rgba(124, 58, 237, 0.35);
    }

    h1 {
      text-align: center;
      font-size: 29px;
      margin-bottom: 8px;
    }

    .subtitle {
      margin-bottom: 28px;
      color: #c7c9d8;
      text-align: center;
      font-size: 14px;
    }

    .input-box {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e5e7eb;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.28);
      color: white;
      font-size: 15px;
      transition: 0.25s ease;
    }

    input::placeholder {
      color: #a6a8b8;
    }

    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.16);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 52px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 13px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .show-password:hover {
      opacity: 0.75;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 27px rgba(99, 102, 241, 0.4);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
    }

    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 28px 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="logo">🔐</div>

    <h1>Logowanie</h1>
    <p class="subtitle">Wprowadź login i hasło</p>

    <form id="loginForm">
      <div class="input-box">
        <label for="login">Login</label>

        <input
          type="text"
          id="login"
          placeholder="Wpisz login"
          autocomplete="username"
          required
        >
      </div>

      <div class="input-box">
        <label for="password">Hasło</label>

        <div class="password-box">
          <input
            type="password"
            id="password"
            placeholder="Wpisz hasło"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
            aria-label="Pokaż hasło"
          >
            👁
          </button>
        </div>
      </div>

      <button type="submit" class="login-button">
        Zaloguj się
      </button>

      <div id="message" class="message"></div>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginInput = document.getElementById("login");
    const passwordInput = document.getElementById("password");
    const showPasswordButton = document.getElementById("showPassword");
    const message = document.getElementById("message");

    showPasswordButton.addEventListener("click", () => {
      const passwordIsHidden = passwordInput.type === "password";

      if (passwordIsHidden) {
        passwordInput.type = "text";
        showPasswordButton.textContent = "🙈";
        showPasswordButton.setAttribute("aria-label", "Ukryj hasło");
      } else {
        passwordInput.type = "password";
        showPasswordButton.textContent = "👁";
        showPasswordButton.setAttribute("aria-label", "Pokaż hasło");
      }
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const login = loginInput.value.trim();
      const password = passwordInput.value.trim();

      message.className = "message";

      if (login === "admin" && password === "1234") {
        message.textContent = "Zalogowano pomyślnie!";
        message.classList.add("success");

        setTimeout(() => {
          window.location.href = "panel.html";
        }, 1000);
      } else {
        message.textContent = "Nieprawidłowy login lub hasło.";
        message.classList.add("error");
      }
    });
  </script>

</body>
</html>
