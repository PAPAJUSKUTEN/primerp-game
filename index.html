<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaiRox — Twoje filmy</title>
<style>
  :root {
    --bg: #0f0f0f;
    --bg-2: #181818;
    --bg-3: #212121;
    --text: #f1f1f1;
    --muted: #aaaaaa;
    --red: #ff2d55;
    --hover: #2a2a2a;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* GÓRNY PASEK */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid #222;
    z-index: 100;
  }

  .left {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .menu-btn {
    background: none;
    border: none;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    cursor: pointer;
  }

  .logo span {
    color: var(--red);
  }

  .logo-badge {
    background: var(--red);
    color: white;
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 4px;
    font-weight: 700;
  }

  .search-box {
    display: flex;
    flex: 1;
    max-width: 600px;
    margin: 0 30px;
  }

  .search-box input {
    flex: 1;
    background: #121212;
    border: 1px solid #303030;
    border-right: none;
    color: var(--text);
    padding: 10px 16px;
    border-radius: 20px 0 0 20px;
    outline: none;
  }

  .search-box button {
    background: #222;
    border: 1px solid #303030;
    color: var(--text);
    padding: 0 20px;
    border-radius: 0 20px 20px 0;
    cursor: pointer;
  }

  .search-box button:hover {
    background: #303030;
  }

  .right {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red), #ff7eb3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    cursor: pointer;
  }

  /* LAYOUT */
  .layout {
    display: flex;
    padding-top: 60px;
  }

  /* SIDEBAR */
  aside {
    width: 220px;
    background: var(--bg);
    position: fixed;
    top: 60px;
    bottom: 0;
    left: 0;
    padding: 12px;
    overflow-y: auto;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--text);
    font-size: 14px;
  }

  .nav-item:hover {
    background: var(--hover);
  }

  .nav-item.active {
    background: var(--bg-3);
    font-weight: 600;
  }

  .divider {
    height: 1px;
    background: #272727;
    margin: 12px 0;
  }

  .sidebar-title {
    color: var(--muted);
    font-size: 13px;
    padding: 8px 14px;
  }

  /* MAIN */
  main {
    margin-left: 220px;
    padding: 20px;
    width: 100%;
  }

  /* FILTRY */
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .filter {
    background: var(--bg-2);
    border: 1px solid #303030;
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }

  .filter.active {
    background: var(--text);
    color: #000;
    border-color: var(--text);
  }

  /* SIATKA FILMÓW */
  .videos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .video-card {
    cursor: pointer;
  }

  .thumbnail {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(135deg, #1f1f1f, #333);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }

  .duration {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0, 0, 0, 0.8);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  .video-info {
    display: flex;
    gap: 12px;
    margin-top: 12px;
  }

  .channel-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  .video-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 5px;
  }

  .video-meta {
    color: var(--muted);
    font-size: 13px;
  }

  /* ODTWARZACZ */
  .player-section {
    display: none;
    max-width: 1000px;
    margin: 0 auto;
  }

  .player-section.visible {
    display: block;
  }

  .video-player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    margin-bottom: 16px;
  }

  .player-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .player-actions {
    display: flex;
    gap: 10px;
    margin: 16px 0;
    flex-wrap: wrap;
  }

  .action-btn {
    background: var(--bg-2);
    border: none;
    color: var(--text);
    padding: 9px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
  }

  .action-btn:hover {
    background: var(--hover);
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 14px;
  }

  /* RESPONSYWNOŚĆ */
  @media (max-width: 900px) {
    aside {
      display: none;
    }
    main {
      margin-left: 0;
    }
    .search-box {
      display: none;
    }
  }
</style>
</head>
<body>

<header>
  <div class="left">
    <button class="menu-btn">☰</button>
    <div class="logo" onclick="goHome()">
      Kai<span>Rox</span>
      <div class="logo-badge">PL</div>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Szukaj filmów na KaiRox">
    <button onclick="searchVideos()">🔍</button>
  </div>

  <div class="right">
    <button class="icon-btn">🔔</button>
    <button class="icon-btn">＋</button>
    <div class="avatar">N</div>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="nav-item active" onclick="goHome()">🏠 Start</div>
    <div class="nav-item">⚡ Shorts</div>
    <div class="nav-item">📺 Subskrypcje</div>

    <div class="divider"></div>

    <div class="sidebar-title">Ty</div>
    <div class="nav-item">🕘 Historia</div>
    <div class="nav-item">👍 Polubione</div>
    <div class="nav-item">💾 Do obejrzenia</div>

    <div class="divider"></div>

    <div class="sidebar-title">Kategorie</div>
    <div class="nav-item">🎮 Gaming</div>
    <div class="nav-item">💻 Programowanie</div>
    <div class="nav-item">🎵 Muzyka</div>
    <div class="nav-item">⚽ Sport</div>
    <div class="nav-item">📚 Nauka</div>
  </aside>

  <main>
    <!-- STRONA GŁÓWNA -->
    <section id="homePage">
      <div class="filters">
        <button class="filter active">Wszystko</button>
        <button class="filter">Gaming</button>
        <button class="filter">Programowanie</button>
        <button class="filter">Muzyka</button>
        <button class="filter">Roblox</button>
        <button class="filter">Live</button>
      </div>

      <div class="videos" id="videoGrid"></div>
    </section>

    <!-- STRONA FILMU -->
    <section id="playerPage" class="player-section">
      <button class="back-btn" onclick="goHome()">← Wróć</button>

      <div class="video-player" id="playerThumbnail">▶</div>

      <h1 class="player-title" id="playerTitle"></h1>
      <div class="video-meta" id="playerMeta"></div>

      <div class="player-actions">
        <button class="action-btn">👍 12 tys.</button>
        <button class="action-btn">👎</button>
        <button class="action-btn">↗ Udostępnij</button>
        <button class="action-btn">💾 Zapisz</button>
      </div>
    </section>
  </main>
</div>

<script>
  const videos = [
    {
      title: "Jak zrobić grę w Roblox Studio — poradnik dla początkujących",
      channel: "KaiRox Dev",
      views: "128 tys. wyświetleń",
      time: "2 dni temu",
      duration: "14:22",
      icon: "🎮"
    },
    {
      title: "HTML, CSS i JavaScript — zbuduj stronę internetową od zera",
      channel: "KaiRox Code",
      views: "76 tys. wyświetleń",
      time: "5 dni temu",
      duration: "28:41",
      icon: "💻"
    },
    {
      title: "Najlepsze ustawienia graficzne do gier w 2026",
      channel: "KaiRox Gaming",
      views: "412 tys. wyświetleń",
      time: "1 tydzień temu",
      duration: "9:05",
      icon: "🖥️"
    },
    {
      title: "Python GUI — aplikacja z przyciskami krok po kroku",
      channel: "KaiRox Code",
      views: "54 tys. wyświetleń",
      time: "3 dni temu",
      duration: "19:37",
      icon: "🐍"
    },
    {
      title: "Roblox: efekty pogodowe i atmosfera w swojej grze",
      channel: "KaiRox Dev",
      views: "89 tys. wyświetleń",
      time: "4 dni temu",
      duration: "11:48",
      icon: "🌧️"
    },
    {
      title: "Lo-fi music do kodowania — 1 godzina skupienia",
      channel: "KaiRox Music",
      views: "1,2 mln wyświetleń",
      time: "1 miesiąc temu",
      duration: "1:02:14",
      icon: "🎧"
    },
    {
      title: "Jak zaprojektować nowoczesny UI strony internetowej",
      channel: "KaiRox Design",
      views: "33 tys. wyświetleń",
      time: "6 dni temu",
      duration: "16:29",
      icon: "🎨"
    },
    {
      title: "Największe błędy początkujących programistów",
      channel: "KaiRox Code",
      views: "210 tys. wyświetleń",
      time: "2 tygodnie temu",
      duration: "12:53",
      icon: "🧠"
    }
  ];

  const grid = document.getElementById("videoGrid");
  const homePage = document.getElementById("homePage");
  const playerPage = document.getElementById("playerPage");

  function renderVideos(list) {
    grid.innerHTML = "";

    list.forEach(video => {
      const card = document.createElement("div");
      card.className = "video-card";

      card.innerHTML = `
        <div class="thumbnail">
          ${video.icon}
          <div class="duration">${video.duration}</div>
        </div>
        <div class="video-info">
          <div class="channel-avatar">K</div>
          <div>
            <div class="video-title">${video.title}</div>
            <div class="video-meta">${video.channel}</div>
            <div class="video-meta">${video.views} • ${video.time}</div>
          </div>
        </div>
      `;

      card.onclick = () => openVideo(video);
      grid.appendChild(card);
    });
  }

  function openVideo(video) {
    homePage.style.display = "none";
    playerPage.classList.add("visible");

    document.getElementById("playerTitle").textContent = video.title;
    document.getElementById("playerMeta").textContent =
      `${video.channel} • ${video.views} • ${video.time}`;
    document.getElementById("playerThumbnail").textContent = video.icon;

    window.scrollTo(0, 0);
  }

  function goHome() {
    playerPage.classList.remove("visible");
    homePage.style.display = "block";
    window.scrollTo(0, 0);
  }

  function searchVideos() {
    const query = document.getElementById("searchInput").value.toLowerCase();

    const results = videos.filter(video =>
      video.title.toLowerCase().includes(query) ||
      video.channel.toLowerCase().includes(query)
    );

    renderVideos(results);
  }

  document.getElementById("searchInput").addEventListener("keydown", event => {
    if (event.key === "Enter") searchVideos();
  });

  document.querySelectorAll(".filter").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
      button.classList.add("active");

      const category = button.textContent.toLowerCase();

      if (category === "wszystko") {
        renderVideos(videos);
      } else {
        const filtered = videos.filter(video =>
          video.title.toLowerCase().includes(category)
        );
        renderVideos(filtered);
      }
    });
  });

  renderVideos(videos);
</script>

</body>
</html>
