<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MidNight RP - Strona niedostępna</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d15 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #e0e0e0;
    text-align: center;
    padding: 20px;
  }

  .container {
    max-width: 600px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(138, 43, 226, 0.3);
    border-radius: 16px;
    padding: 50px 40px;
    box-shadow: 0 0 40px rgba(138, 43, 226, 0.15);
  }

  .icon {
    font-size: 60px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 15px;
    background: linear-gradient(90deg, #8a2be2, #4b0082);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p {
    font-size: 1.05rem;
    line-height: 1.6;
    color: #b0b0b0;
    margin-bottom: 10px;
  }

  .badge {
    margin-top: 25px;
    display: inline-block;
    padding: 8px 20px;
    border-radius: 30px;
    background: rgba(138, 43, 226, 0.15);
    border: 1px solid rgba(138, 43, 226, 0.4);
    font-size: 0.9rem;
    color: #c9a0ff;
  }

  .footer {
    margin-top: 30px;
    font-size: 0.8rem;
    color: #666;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">🌙</div>
    <h1>MidNight RP</h1>
    <p>Strona jest tymczasowo niedostępna z powodu nieobecności właściciela.</p>
    <p>Prosimy o cierpliwość — wszystko wróci do normy, gdy tylko właściciel będzie ponownie dostępny.</p>
    <div class="badge">Status: Niedostępna</div>
    <div class="footer">© MidNight RP</div>
  </div>
</body>
</html>
