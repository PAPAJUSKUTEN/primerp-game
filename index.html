<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie | Venus RP</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070b12;
            --bg-gradient: radial-gradient(circle at 18% 18%, rgba(59, 130, 246, 0.20), transparent 31%),
                           radial-gradient(circle at 82% 76%, rgba(30, 64, 175, 0.18), transparent 32%),
                           #070d16;
            --card-bg: linear-gradient(145deg, rgba(22, 35, 55, 0.96), rgba(10, 16, 27, 0.98));
            --border: rgba(147, 197, 253, 0.18);
            --border-light: rgba(147, 197, 253, 0.08);
            --text: #f4f7fb;
            --text-secondary: #9ca8b8;
            --text-muted: #667386;
            --blue: #3b82f6;
            --blue-dark: #2563eb;
            --blue-light: #60a5fa;
            --red: #ef4444;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Inter', sans-serif;
            display: grid;
            place-items: center;
            padding: 20px;
            overflow: auto;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 18px;
            pointer-events: none;
            border: 1px solid var(--border-light);
            border-radius: 20px;
        }

        .login-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 38px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
            z-index: 10;
        }

        .login-icon {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin-bottom: 24px;
            border-radius: 15px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 24px;
            box-shadow: 0 10px 28px rgba(37, 99, 235, 0.28);
        }

        .login-header h1 {
            margin: 0;
            color: var(--text);
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .login-header p {
            margin: 9px 0 27px;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
        }

        .form-group {
            display: block;
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 47px;
            padding: 0 14px 0 42px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            outline: none;
            background: #0a1019;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: rgba(96, 165, 250, 0.72);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 4px;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--text-secondary);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 12px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--blue);
            cursor: pointer;
        }

        .checkbox-wrapper span {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .forgot-password {
            color: var(--blue-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: var(--blue);
        }

        .login-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-button:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            min-height: 19px;
            margin: 14px 0 0;
            color: #fca5a5;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .error-message:empty {
            display: none;
        }

        .login-footer {
            margin-top: 24px;
            padding-top: 17px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            color: var(--text-muted);
            font-size: 10px;
            line-height: 1.55;
            text-align: center;
        }

        .login-footer i {
            margin-right: 6px;
            color: var(--blue-light);
        }

        @media (max-width: 520px) {
            .login-container {
                padding: 29px 24px;
            }
            
            body {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        
        <div class="login-header">
            <h1>Dostęp do systemu</h1>
            <p>Zaloguj się, aby uzyskać dostęp do panelu Venus RP Police Department.</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Identyfikator</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Wpisz identyfikator służbowy"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Hasło</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Wpisz hasło"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fa-regular fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="remember">
                    <span>Zapamiętaj mnie</span>
                </label>
                <a href="#" class="forgot-password">Nie pamiętasz hasła?</a>
            </div>
            
            <button type="submit" class="login-button" id="loginBtn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Zaloguj się
            </button>
            
            <p class="error-message" id="errorMessage"></p>
        </form>
        
        <div class="login-footer">
            <i class="fa-solid fa-circle-info"></i>
            Środowisko demonstracyjne • Dane dostępowe są tymczasowe
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        const demoCredentials = {
            username: 'policja',
            password: 'venus2026'
        };

        function togglePassword() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            errorMessage.textContent = '';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Logowanie...';
            
            await new Promise(resolve => setTimeout(resolve, 800));
            
            if (username !== demoCredentials.username || password !== demoCredentials.password) {
                errorMessage.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Nieprawidłowy identyfikator lub hasło';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Zaloguj się';
                passwordInput.focus();
                return;
            }
            
            loginBtn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Zalogowano pomyślnie!';
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        });

        usernameInput.addEventListener('input', () => {
            if (errorMessage.textContent) {
                errorMessage.textContent = '';
            }
        });
    </script>
</body>
</html>
