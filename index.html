<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENUS RP | Logowanie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --background: #060912;
            --panel: rgba(13, 21, 36, .88);
            --panel-border: rgba(148, 163, 184, .18);
            --text: #f8fafc;
            --muted: #94a3b8;
            --blue: #3b82f6;
            --blue-light: #60a5fa;
            --danger: #fb7185;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            overflow: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 15%, rgba(37, 99, 235, .18), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(124, 58, 237, .15), transparent 32%),
                linear-gradient(135deg, #040711, var(--background));
            font-family: Inter, sans-serif;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }

        .login-screen {
            position: relative;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            isolation: isolate;
        }

        .orb {
            position: absolute;
            z-index: -1;
            border: 1px solid rgba(96, 165, 250, .12);
            border-radius: 50%;
            pointer-events: none;
        }

        .orb-one {
            width: 430px;
            height: 430px;
            left: -210px;
            bottom: -220px;
            box-shadow: 0 0 0 32px rgba(96, 165, 250, .025), 0 0 0 66px rgba(96, 165, 250, .018);
        }

        .orb-two {
            width: 300px;
            height: 300px;
            top: -160px;
            right: -130px;
            border-color: rgba(167, 139, 250, .14);
            box-shadow: 0 0 0 30px rgba(167, 139, 250, .025), 0 0 0 62px rgba(167, 139, 250, .018);
        }

        .login-card {
            position: relative;
            width: min(430px, 100%);
            padding: 38px 36px 30px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            background: linear-gradient(160deg, rgba(20, 31, 52, .94), rgba(8, 14, 25, .97));
            box-shadow: 0 35px 100px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255, 255, 255, .025);
            animation: card-in .55s cubic-bezier(.2, .8, .2, 1) both;
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 14%;
            right: 14%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--blue-light), #a78bfa, transparent);
            box-shadow: 0 0 22px rgba(96, 165, 250, .7);
        }

        .brand { text-align: center; margin-bottom: 27px; }

        .brand-logo {
            width: 70px;
            height: 70px;
            display: grid;
            place-items: center;
            position: relative;
            margin: 0 auto 17px;
            border: 1px solid rgba(147, 197, 253, .42);
            border-radius: 21px;
            color: white;
            background: linear-gradient(145deg, #2563eb, #1e40af 58%, #172554);
            box-shadow: 0 15px 35px rgba(37, 99, 235, .32), 0 0 0 8px rgba(59, 130, 246, .07);
            font-size: 28px;
        }

        .brand-logo::after {
            content: "";
            position: absolute;
            inset: 5px;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 16px;
        }

        .brand h1 { font-size: 19px; letter-spacing: 1.2px; }
        .brand p { margin-top: 8px; color: #93c5fd; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }

        .intro { margin: -10px 0 23px; color: var(--muted); font-size: 11px; line-height: 1.6; text-align: center; }
        .field { margin-bottom: 17px; }
        .field label { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; color: #cbd5e1; font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
        .field label i { color: var(--blue-light); }
        .input-wrap { position: relative; }
        .input-wrap > i { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #64748b; pointer-events: none; transition: color .2s ease; }
        .input-wrap:focus-within > i { color: var(--blue-light); }
        input { width: 100%; height: 47px; padding: 0 44px; outline: 0; color: var(--text); border: 1px solid rgba(148, 163, 184, .17); border-radius: 11px; background: rgba(3, 7, 18, .58); transition: .2s ease; }
        input:hover { border-color: rgba(148, 163, 184, .3); }
        input:focus { border-color: var(--blue); background: rgba(15, 27, 47, .85); box-shadow: 0 0 0 4px rgba(59, 130, 246, .12); }
        input::placeholder { color: #64748b; }
        .password-toggle { position: absolute; top: 50%; right: 8px; width: 31px; height: 31px; transform: translateY(-50%); border: 0; border-radius: 7px; color: #64748b; background: transparent; }
        .password-toggle:hover { color: white; background: rgba(255, 255, 255, .06); }
        .security-line { display: flex; justify-content: center; gap: 18px; margin: 2px 0 19px; color: #64748b; font-size: 10px; }
        .security-line span { display: inline-flex; align-items: center; gap: 6px; }
        .security-line i { color: var(--blue-light); }
        .submit { width: 100%; min-height: 47px; border: 1px solid rgba(147, 197, 253, .28); border-radius: 11px; color: white; background: linear-gradient(135deg, #3b82f6, #2563eb 55%, #1d4ed8); box-shadow: 0 12px 28px rgba(37, 99, 235, .25); font-size: 12px; font-weight: 800; transition: .2s ease; }
        .submit:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 16px 34px rgba(37, 99, 235, .34); }
        .submit:active { transform: translateY(0); }
        .error { display: none; margin-bottom: 15px; padding: 11px 12px; color: #fecdd3; border: 1px solid rgba(251, 113, 133, .25); border-radius: 10px; background: rgba(244, 63, 94, .1); font-size: 11px; font-weight: 600; }
        .error.active { display: block; animation: error-in .25s ease both; }
        .error i { margin-right: 7px; }
        .footer { display: flex; justify-content: center; gap: 7px; margin-top: 23px; color: #475569; font-size: 9px; }
        .footer i { color: #22c55e; font-size: 7px; }

        @keyframes card-in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes error-in { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            body { overflow: auto; }
            .login-screen { padding: 18px 14px; }
            .login-card { padding: 30px 22px 24px; }
            .brand-logo { width: 62px; height: 62px; font-size: 24px; }
        }
    </style>
</head>
<body>
    <main class="login-screen">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <section class="login-card" aria-labelledby="loginTitle">
            <header class="brand">
                <div class="brand-logo"><i class="fa-solid fa-shield-halved"></i></div>
                <h1 id="loginTitle">VENUS RP POLICE</h1>
                <p>Bezpieczny dostęp do MTD</p>
            </header>

            <p class="intro">Zaloguj się przy użyciu danych służbowych, aby uzyskać dostęp do terminala.</p>

            <div class="error" id="loginError" role="alert">
                <i class="fa-solid fa-triangle-exclamation"></i>
                Nieprawidłowy numer służbowy lub hasło.
            </div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="username"><i class="fa-solid fa-id-badge"></i> Numer służbowy</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user-shield"></i>
                        <input id="username" name="username" type="text" autocomplete="username" placeholder="np. kowalski" spellcheck="false" required>
                    </div>
                </div>

                <div class="field">
                    <label for="password"><i class="fa-solid fa-lock"></i> Hasło</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-key"></i>
                        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Wprowadź hasło" required>
                        <button class="password-toggle" id="togglePassword" type="button" aria-label="Pokaż hasło"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>

                <div class="security-line">
                    <span><i class="fa-solid fa-shield-halved"></i> Szyfrowane połączenie</span>
                    <span><i class="fa-solid fa-clock"></i> Sesja tymczasowa</span>
                </div>

                <button class="submit" type="submit"><i class="fa-solid fa-right-to-bracket"></i> ZALOGUJ SIĘ DO TERMINALA</button>
            </form>

            <footer class="footer"><i class="fa-solid fa-circle"></i> System MTD Venus RP • Dostęp autoryzowany</footer>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const loginError = document.getElementById("loginError");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            togglePassword.innerHTML = isPassword
                ? '<i class="fa-solid fa-eye-slash"></i>'
                : '<i class="fa-solid fa-eye"></i>';
            togglePassword.setAttribute("aria-label", isPassword ? "Ukryj hasło" : "Pokaż hasło");
        });

        usernameInput.addEventListener("input", () => {
            usernameInput.value = usernameInput.value.replace(/\s/g, "").toLowerCase();
            loginError.classList.remove("active");
        });

        passwordInput.addEventListener("input", () => {
            loginError.classList.remove("active");
        });

        loginForm.addEventListener("submit", event => {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                loginError.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Uzupełnij numer służbowy oraz hasło.';
                loginError.classList.add("active");
                return;
            }

            loginError.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Nieprawidłowy numer służbowy lub hasło.';
            loginError.classList.add("active");
        });
    </script>
</body>
</html>
