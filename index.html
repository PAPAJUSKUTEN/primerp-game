<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logowanie</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(135deg, rgba(10, 15, 35, 0.95), rgba(37, 20, 74, 0.9)),
        radial-gradient(circle at top left, #6741d9, transparent 35%);
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 38px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      animation: showBox 0.7s ease;
    }

    @keyframes showBox {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      font-size: 30px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #c8c8d6;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e4e4ec;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      color: white;
      font-size: 15px;
      transition: 0.25s;
    }

    input::placeholder {
      color: #aaaabd;
    }

    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 52px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #bdbdd0;
      cursor: pointer;
      font-size: 18px;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 4px 0 24px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #c9c9d7;
    }

    .remember input {
      width: auto;
      accent-color: #7c3aed;
    }

    a {
      color: #b69cff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(99, 102, 241, 0.35);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
    }

    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .register {
      margin-top: 25px;
      text-align: center;
      color: #c8c8d6;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 28px 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="logo">🔐</div>

    <h1>Witaj ponownie!</h1>
    <p class="subtitle">Zaloguj się, aby kontynuować</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">Adres e-mail</label>
        <input
          type="email"
          id="email"
          placeholder="np. kontakt@example.com"
          required
        />
      </div>

      <div class="input-group">
        <label for="password">Hasło</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Wpisz swoje hasło"
            minlength="6"
            required
          />

          <button
            type="button"
            class="show-password"
            id="showPassword"
            aria-label="Pokaż hasło"
          >
            👁
          </button>
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" />
          Zapamiętaj mnie
        </label>

        <a href="#">Zapomniałeś hasła?</a>
      </div>

      <button type="submit" class="login-button">
        Zaloguj się
      </button>

      <div id="message" class="message"></div>
    </form>

    <p class="register">
      Nie masz jeszcze konta?
      <a href="#">Zarejestruj się</a>
    </p>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const showPassword = document.getElementById("showPassword");
    const message = document.getElementById("message");

    showPassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      showPassword.textContent = isPassword ? "🙈" : "👁";
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value.trim();

      message.className = "message";

      if (!email || !password) {
        message.textContent = "Uzupełnij wszystkie pola.";
        message.classList.add("error");
        return;
      }

      message.textContent = "Formularz jest poprawny. Podłącz teraz backend logowania.";
      message.classList.add("success");
    });
  </script>
</body>
</html>
