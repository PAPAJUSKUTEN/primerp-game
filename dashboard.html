<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VENUS RP | MTD</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><style>body{margin:0;background:#070b12;color:#f8fafc;font-family:Inter,Arial,sans-serif}.dashboard{max-width:900px;margin:10vh auto;padding:30px}.card{padding:30px;border:1px solid #ffffff14;border-radius:16px;background:#0d141f}.muted{color:#94a3b8}.logout{margin-top:20px;padding:12px 16px;border:0;border-radius:9px;background:#2563eb;color:#fff;cursor:pointer}</style></head><body><main class="dashboard"><section class="card"><h1>Panel MTD</h1><p id="officerInfo" class="muted"></p><button class="logout" id="logout">Wyloguj się</button></section></main><script>const officer=JSON.parse(sessionStorage.getItem("venus_current_officer")||"null");if(!officer)location.href="login.html";else document.getElementById("officerInfo").textContent=`${officer.name} • ${officer.rank} • #${officer.badge} • ${officer.unit}`;document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("venus_current_officer");location.href="login.html"};</script></body></html>
